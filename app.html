<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caminhos da Água</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400..600;1,400..500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="topbar">
  <a class="topbar-brand" href="index.html">Caminhos da <span class="accent-word">Água</span></a>
  <strong id="topbar-missao" aria-live="polite"></strong>
  <button class="text-button" id="btn-tutorial" type="button">Como funciona</button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Navegação da investigação">
  <button data-rota="curso" aria-label="Percurso da disciplina" onclick="location.hash='#/curso'"><span aria-hidden="true">▦</span><span>Percurso</span></button>
  <button data-rota="cebola" aria-label="Início da missão" onclick="location.hash='#/cebola'"><span aria-hidden="true">◉</span><span>Missão</span></button>
  <button data-rota="evidencias" aria-label="Evidências" onclick="location.hash='#/evidencias'"><span aria-hidden="true">▤</span><span>Evidências</span></button>
  <button data-rota="conexoes" aria-label="Conexões" onclick="location.hash='#/conexoes'"><span aria-hidden="true">↗</span><span>Conexões</span></button>
  <button data-rota="relatorio" aria-label="Relatório final" onclick="location.hash='#/relatorio'"><span aria-hidden="true">✓</span><span>Relatório</span></button>
  <button data-rota="perfil" aria-label="Perfil e progresso" onclick="location.hash='#/perfil'"><span aria-hidden="true">○</span><span>Perfil</span></button>
</nav>
<div id="tutorial-root"></div>

<script src="assets/app.js"></script>
<script>
  CaminhosDaAgua.bootApp();
  document.getElementById("btn-tutorial").addEventListener("click", function () { CaminhosDaAgua.abrirTutorial(); });
  (function () {
    try {
      var m = JSON.parse(localStorage.getItem("cda:missao") || "null");
      if (m) document.getElementById("topbar-missao").textContent = m.titulo;
    } catch (e) {}
  })();
</script>
</body>
</html>
